# Cloudflare Worker config for the quiz-tool server.
#
# STAGE: placeholder. `main` points at worker.ts (a health-only stub), NOT the
# Node server in src/ — that server does not run on Workers yet (it uses
# @hono/node-server, better-sqlite3, and runtime pack discovery via node:fs).
# When the real port lands, repoint `main` at the ported entry and keep this
# route unchanged.

name = "quiz-tool"
main = "worker.ts"
compatibility_date = "2026-08-12"

# Binds quiz.colinhauch.com to this Worker on deploy. wrangler creates the DNS
# record AND provisions the TLS cert automatically — no dashboard, no manual DNS.
# Requires: colinhauch.com is an active Cloudflare zone (it is) and the hostname
# has no pre-existing CNAME record.
[[routes]]
pattern = "quiz.colinhauch.com"
custom_domain = true
