name: CI

# Merge gate for the promotion pipeline (spec #71). Runs the fast suite on every
# PR into a long-lived branch. No secrets: the Supabase service key is not added
# here, so the supabase-js store integration tests stay local-only for now.
# The dev->test gate is where slower journey/integration tests will be added
# later; today every target runs the same fast suite.
#
# This workflow does NOT deploy. Worker deploys are handled out-of-band by
# Cloudflare Workers Builds — one connection per Worker, each watching a single
# long-lived branch with non-production branch builds off, invoking
# `@geo/server`'s `deploy:ci`. See docs/deploy/hitl-checklist.md for the exact
# dashboard topology (a feature-branch PR should not trigger a Worker build).

on:
  pull_request:
    branches: [dev, test, prod]

# The job/check name below ("checks") is required by branch protection by name.
# Keep it stable.
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test

      - name: Validate packs
        run: pnpm run packs:validate

      # A case-insensitive filename collision (e.g. abilityChart.ts vs
      # AbilityChart.tsx — #262) cannot surface on Linux CI's case-sensitive
      # filesystem: both files coexist and every build/test stays green, while a
      # macOS/Windows checkout collapses them and the module resolver picks the
      # wrong file, breaking `vite build`. The script understands TS/JS module
      # resolution (it ignores the .ts/.tsx/.js extension, which a plain
      # lowercase-and-dedupe would miss), so the whole class fails the gate here.
      - name: Check for case-insensitive filename collisions
        run: node .github/scripts/check-filename-collisions.mjs

      # Neither typecheck nor tests run the SPA's production bundler, so a break
      # that only surfaces at `vite build` (a bad import, a bundler-only failure)
      # could pass the whole suite. Build the web app for real so that class
      # fails the gate.
      - name: Build web app
        run: pnpm --filter @geo/web build

      # Dry-run the Worker deploy: no Cloudflare credentials needed, and it runs
      # wrangler.toml's [build] hook (bundle-packs + the web build) and compiles
      # the Worker bundle, so a break in the real deploy path fails CI here rather
      # than at deploy time. Runs in packages/server (where wrangler.toml lives).
      - name: Server deploy dry-run
        run: pnpm --filter @geo/server exec wrangler deploy --dry-run

  # Enforces the promotion source: a PR into prod must come from test, and a PR
  # into test must come from dev. PRs into dev have no restriction. Rulesets gate
  # only the base branch, so this required check is how the head branch is
  # constrained. It always runs and always reports, so it never leaves a required
  # check pending. Like "checks", this job name is referenced by the rulesets by
  # name — keep it stable.
  promotion-source:
    name: promotion-source
    runs-on: ubuntu-latest
    steps:
      - name: Enforce promotion source branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          # Same-repo guard: a fork can open a PR whose head branch is *named*
          # dev/test, so promotions must originate from this repo, not a fork.
          # This closes the "branch name, not history" hole once the repo is public.
          if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "::error::Promotion PRs must originate from this repository, not a fork ('$HEAD_REPO')"; exit 1
          fi
          case "$BASE" in
            prod)
              [ "$HEAD" = "test" ] || { echo "::error::PRs into prod must come from test (got '$HEAD')"; exit 1; } ;;
            test)
              [ "$HEAD" = "dev" ]  || { echo "::error::PRs into test must come from dev (got '$HEAD')"; exit 1; } ;;
            *)
              echo "No source restriction for base '$BASE'." ;;
          esac
